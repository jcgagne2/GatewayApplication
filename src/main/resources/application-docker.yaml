server:
  port: 8080
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true

spring:
  security:
    oauth2:
      client:
        registration:
          my-oidc-client:
            provider: my-keycloak
            client-id: gateway-client-docker
            client-secret: VRBDgwUCtQZCsbcAQrNjy1ueqtNqF9Y6
            authorization-grant-type: authorization_code
            scope: openid,profile
        provider:
          my-keycloak:
            issuer-uri: http://keycloak:8080/realms/my-realm
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    enabled: true
    serviceUrl:
      # Dans docker, hostname = nom du service
      defaultZone: ${EUREKA_URI:http://eureka-server:8761/eureka}
  instance:
    preferIpAddress: true

